<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<title>Chat khách hàng</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet"
href="css/repairstore.css">

</head>

<body class="content-page">

<div class="chat-header">

    <div>
        <h1 class="page-title">
            Chat với khách hàng
        </h1>
    </div>

    <div class="search-box">

        <i class="fa-solid fa-search"></i>

        <input type="text"
               placeholder="Tìm khách hàng...">

    </div>

</div>

<div class="chat-container">

    <!-- KHÁCH HÀNG 1 -->

    <div class="customer-item">

        <div class="avatar-wrapper">

            <div class="customer-avatar">
                N
            </div>

        </div>

        <div class="customer-info">

            <div class="customer-name">
                Nguyễn Văn A
            </div>

            <div class="last-message">
                Anh báo giá thay màn hình iPhone 13 giúp em.
            </div>

        </div>

        <div class="chat-meta">

            <div class="chat-time">
                10:25
            </div>

            <div class="unread">
                2
            </div>

        </div>

    </div>

    <!-- KHÁCH HÀNG 2 -->

    <div class="customer-item">

        <div class="avatar-wrapper">

            <div class="customer-avatar">
                T
            </div>

        </div>

        <div class="customer-info">

            <div class="customer-name">
                Trần Thị B
            </div>

            <div class="last-message">
                Laptop Dell bị chai pin, shop sửa được không ạ?
            </div>

        </div>

        <div class="chat-meta">

            <div class="chat-time">
                09:40
            </div>

        </div>

    </div>

    <!-- KHÁCH HÀNG 3 -->

    <div class="customer-item">

        <div class="avatar-wrapper">

            <div class="customer-avatar">
                L
            </div>

        </div>

        <div class="customer-info">

            <div class="customer-name">
                Lê Minh C
            </div>

            <div class="last-message">
                Bao giờ máy sửa xong ạ?
            </div>

        </div>

        <div class="chat-meta">

            <div class="chat-time">
                Hôm qua
            </div>

            <div class="unread">
                1
            </div>

        </div>

    </div>

    <!-- KHÁCH HÀNG 4 -->

    <div class="customer-item">

        <div class="avatar-wrapper">

            <div class="customer-avatar">
                P
            </div>

        </div>

        <div class="customer-info">

            <div class="customer-name">
                Phạm Gia D
            </div>

            <div class="last-message">
                Cảm ơn shop đã hỗ trợ.
            </div>

        </div>

        <div class="chat-meta">

            <div class="chat-time">
                2 ngày trước
            </div>

        </div>

    </div>

</div>

<script src="js/data-loader.js"></script>
<script src="js/main.js"></script>
</body>
</html>
