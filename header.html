<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOcycle</title>
    <link rel="stylesheet" href="css/mainstyle.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<header class="header">
    <div class="top-header">
        <div class="logo">
            <span class="logo-green">ECO</span>cycle
        </div>

        <div class="search-box">
            <input type="text" placeholder="Tìm kiếm sản phẩm, dịch vụ...">
            <button>
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="header-actions">

            <button class="coin-btn">
                <i class="fa-solid fa-coins"></i>
                Green Coin
            </button>

            <div class="icon-box">
                <i class="fa-regular fa-comments"></i>
            </div>

            <div class="icon-box notification">
                <i class="fa-regular fa-bell"></i>
                <span class="badge">2</span>
            </div>

            <div class="user-info">
                <i class="fa-solid fa-circle-user"></i>
                <span>User</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <a href="#" target="body">Trang chủ</a>
        <a href="#" target="body">Marketplace</a>
        <a href="#" target="body">Sửa chữa & tái chế</a>
        <a href="green_dashboard.html" target="body">Môi trường</a>
    </nav>

</header>
<script src="js/data-loader.js"></script>
<script src="js/main.js"></script>

</body>
</html>
